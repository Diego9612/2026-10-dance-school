{% extends "base.html" %}
{% load static %}

{% block title %}Home - Dance School{% endblock %}

{% block content %}

    <!-- CAROUSEL -->
    <div id="carouselHome" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{% static 'img/foto1.jpg' %}" class="d-block w-100" alt="Classe di danza">
            </div>
            <div class="carousel-item">
                <img src="{% static 'img/foto2.jpg' %}" class="d-block w-100" alt="Saggio di fine anno">
            </div>
            <div class="carousel-item">
                <img src="{% static 'img/foto3.jpg' %}" class="d-block w-100" alt="Hip hop">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselHome" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselHome" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- SEZIONE TESTO -->
    <section>
        <h1>Benvenuti alla Dance School</h1>
        <p>Corsi di danza classica, moderna e hip hop per bambini, ragazzi e adulti.</p>
        <p>Iscriviti alla prima lezione di prova gratuita!</p>
    </section>

{% endblock %}
