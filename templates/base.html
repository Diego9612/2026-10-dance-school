{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dance School{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/toggle-modals.js' %}" defer></script>
</head>
<body>

    <!-- NAVBAR -->
    {% include "components/navbar.html" %}

    <!-- CONTENIDO DE CADA PÁGINA -->
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center py-3">
        <p class="mb-1">Dance School Modena</p>
        <a class="text-light" href="tel:+390591234567">059 123 4567</a> ·
        <a class="text-light" href="mailto:info@danceschool.it">info@danceschool.it</a>
    </footer>

    <!-- MODAL REGISTRATI (versione del prof: CSS + JS) -->
    <section id="registrati">
        <form>
            <p>
                <label for="registrati-nome">Nome</label>
                <input type="text" name="nome" id="registrati-nome">
            </p>
            <p>
                <label for="registrati-cognome">Cognome</label>
                <input type="text" name="cognome" id="registrati-cognome">
            </p>
            <p>
                <label for="registrati-email">Email</label>
                <input type="email" name="email" id="registrati-email">
            </p>
            <p>
                <button type="submit">Invia</button>
            </p>
        </form>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
